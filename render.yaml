services:
  # Python FastAPI Backend with native Server-Sent Events (SSE) streaming support
  - type: web
    name: shikshasetu-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://shikshasetu-ai-beta.vercel.app,https://pradeepchinige09.github.io,http://localhost:5173
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false

  # React + Vite Static Frontend
  - type: static_site
    name: shikshasetu-frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          name: shikshasetu-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
